[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reproflow"
version = "0.1.0"
description = "A reproducible-engineering framework for security-relevant data pipelines: packaging, testing, CI, provenance logging, and a publish gate, plus an auditor that scores a repository against the standard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Friday Ogochukwu Ikwuogu", email = "Friday.ikwuogu@gmail.com" },
]
keywords = [
  "reproducibility",
  "research-software",
  "data-pipeline",
  "provenance",
  "continuous-integration",
  "open-science",
  "critical-infrastructure-security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]
figures = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/foikwuogu/reproflow"
Issues = "https://github.com/foikwuogu/reproflow/issues"

[project.scripts]
reproflow = "reproflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reproflow = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
